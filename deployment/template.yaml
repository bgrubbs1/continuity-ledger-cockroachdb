AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Continuity Ledger synthetic-only contest deployment

Parameters:
  DatabaseParameterName:
    Type: String
    Default: /continuity-ledger/database-url
    AllowedPattern: '^/[A-Za-z0-9_./-]+$'
    Description: Encrypted Standard SSM parameter containing the contest-only database URL
  JwtIssuer:
    Type: String
    AllowedPattern: "^https://.+"
    Description: HTTPS issuer for the contest-only API identity provider
  JwtAudience:
    Type: String
    MinLength: 1
    Description: Audience accepted by the contest-only API

Resources:
  ContinuityLedgerApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Auth:
        Authorizers:
          ContinuityJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Ref JwtIssuer
              audience:
                - !Ref JwtAudience
        DefaultAuthorizer: ContinuityJwtAuthorizer

  ContinuityLedgerFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Timeout: 15
      MemorySize: 512
      Environment:
        Variables:
          DATABASE_PARAMETER_NAME: !Ref DatabaseParameterName
          ALLOW_LOCAL_SQLITE: "false"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseParameterName}
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContinuityLedgerApi
            Path: /healthz
            Method: GET
            Auth:
              Authorizer: NONE
        DemoHome:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContinuityLedgerApi
            Path: /
            Method: GET
            Auth:
              Authorizer: NONE
        DemoScenarios:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContinuityLedgerApi
            Path: /demo/scenarios
            Method: GET
            Auth:
              Authorizer: NONE
        DemoSeed:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContinuityLedgerApi
            Path: /demo/seed
            Method: POST
            Auth:
              Authorizer: NONE
        DemoRun:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContinuityLedgerApi
            Path: /demo/run
            Method: POST
            Auth:
              Authorizer: NONE
        Events:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContinuityLedgerApi
            Path: /events
            Method: POST
        Search:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContinuityLedgerApi
            Path: /search
            Method: POST
        AgentRun:
          Type: HttpApi
          Properties:
            ApiId: !Ref ContinuityLedgerApi
            Path: /agent/run
            Method: POST
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ..
      DockerTag: python3.12-v1

Outputs:
  DemoUrl:
    Description: Public fixed-scenario demo URL
    Value: !Sub https://${ContinuityLedgerApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/
  FunctionName:
    Description: Deployed Lambda function name
    Value: !Ref ContinuityLedgerFunction
